<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Manage Events</h1>
    <button class="btn btn-primary" (click)="onAddClick()" *ngIf="!showForm">
      + Add New Event
    </button>
  </div>

  <div *ngIf="showForm" class="card border-0 shadow-sm mb-5">
    <div class="card-body">
      <h4 class="mb-4">{{ editingEvent ? 'Edit Event' : 'Add New Event' }}</h4>
      <app-event-form [event]="editingEvent" (submit)="onFormSubmit($event)" (cancel)="onFormCancel()"></app-event-form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-light">
        <tr>
          <th>Title</th>
          <th>Date</th>
          <th>Location</th>
          <th>Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let event of events">
          <td>{{ event.title }}</td>
          <td>{{ formatDate(event.date) }}</td>
          <td>{{ event.location }}</td>
          <td><span [ngClass]="event.type === 'upcoming' ? 'badge bg-success' : 'badge bg-secondary'">{{ event.type }}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-2" (click)="onEditClick(event)">
              Edit
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="onDelete(event.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="events.length === 0" class="text-muted text-center py-5">No events found. Add a new event to get started.</p>
  </div>
</div>
