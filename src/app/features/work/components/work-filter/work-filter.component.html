<div class="filter-card p-4 bg-light rounded mb-4">
  <h5 class="mb-4">Filter Works</h5>

  <div class="row mb-3">
    <div class="col-md-6 mb-3">
      <label for="categorySelect" class="form-label">Category</label>
      <select class="form-select" id="categorySelect" [(ngModel)]="selectedCategory" (change)="applyFilter()">
        <option value="">All Categories</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="col-md-6 mb-3">
      <label for="searchInput" class="form-label">Search</label>
      <input
        type="text"
        class="form-control"
        id="searchInput"
        placeholder="Search works..."
        [(ngModel)]="searchText"
        (keyup)="applyFilter()"
      >
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-6 mb-3">
      <label for="startDate" class="form-label">Start Date</label>
      <input
        type="date"
        class="form-control"
        id="startDate"
        [(ngModel)]="startDate"
        (change)="applyFilter()"
      >
    </div>

    <div class="col-md-6 mb-3">
      <label for="endDate" class="form-label">End Date</label>
      <input
        type="date"
        class="form-control"
        id="endDate"
        [(ngModel)]="endDate"
        (change)="applyFilter()"
      >
    </div>
  </div>

  <button class="btn btn-secondary" (click)="resetFilter()">Clear Filters</button>
</div>
